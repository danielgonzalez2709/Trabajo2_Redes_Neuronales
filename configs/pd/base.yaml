# Configuración completa de la PD (Parte B; núcleo §4.1: `python run.py pd --config configs/pd/base.yaml`).
# B3 (logística de referencia, Parte B §3.1) declara aquí el bloque `logistica`; el bloque `mlp` (núcleo §5.3) llega por
# herencia desde mlp_final.yaml (B4).
# Rejilla de C: 13 valores de 1e-4 a 1e2, cada medio orden de magnitud (decisión de Andrés, 25-oct). C se elige con la
# log-loss de validación; el número de valores es el presupuesto `n_configuraciones_busqueda` (núcleo §6).
# El bloque mlp vive en mlp_final.yaml: lo reescribe `python run.py pd-hpo` (B4) con el mejor ensayo y su procedencia
# (bloque `busqueda`). Los --set mlp.* se aplican después de la herencia, así que siempre ganan.
hereda: mlp_final.yaml
base_seed: 0  # semilla del muestreador TPE y de los ensayos de pd-hpo (B4); B5: semilla efectiva base_seed + k
# B6 (núcleo §4.1): muestra estratificada por split antes de transformar; null = todos los datos (corrida reportada).
# La usa la demo (configs/pd/demo.yaml) y --set datos.muestra=20000; run.py pd-hpo la ignora (usa todos los datos).
datos:
  muestra: null  # null o entero ≥ 3 (uno por split); el sorteo usa make_rng(base_seed, 0)
logistica:
  rejilla_C: [1.0e-4, 3.1623e-4, 1.0e-3, 3.1623e-3, 1.0e-2, 3.1623e-2, 1.0e-1, 3.1623e-1, 1.0, 3.1623, 10.0, 31.623, 100.0]
  max_iter: 1000
  tol: 1.0e-6
# B5 (Parte B §3.5, Spec v0.16): MLP final con semillas efectivas base_seed + 0…n−1; demo: --set semillas.n=3.
semillas:
  n: 30  # comparación justa: ≥ 30 semillas de la configuración final (enunciado; núcleo §6)
# Carpetas de salida (relativas a la raíz; los nombres de archivo son los del núcleo §5.4). En pruebas, a tmp_path.
salida: results/data/pd  # semillas/, summary.json, pred_test.parquet, busqueda_logistica.json
modelos: models  # pd_logistica.joblib y pd_mlp.pt
