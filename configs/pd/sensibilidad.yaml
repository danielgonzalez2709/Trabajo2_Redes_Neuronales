# Parte B — análisis de sensibilidad con grade e int_rate (B10, B-pd §3.8):
# `python run.py pd-sensibilidad --config configs/pd/sensibilidad.yaml`.
# Completa, sin `hereda` (como demo.yaml): heredar base.yaml traería el bloque `busqueda` de mlp_final.yaml, que
# corresponde a la búsqueda con las 15 variables del modelo principal. Una prueba exige que `mlp` = mlp_final.yaml,
# `logistica` = base.yaml y `hpo.espacio`/`hpo.n_ensayos` = hpo.yaml (alarma si cambian).
# Escribe solo en results/data/pd_sensibilidad/ y models/pd_sensibilidad/: nunca toca results/data/pd/, models/pd_* ni
# configs/pd/mlp_final.yaml (lo usan C y E). No va a la app.
# Demo y pruebas: --set datos.muestra=5000 --set semillas.n=2 --set hpo.n_ensayos=2 y las rutas de `sensibilidad`
# (union, preprocesador, salida, modelos) apuntando a una carpeta temporal.
base_seed: 0  # semilla del muestreo, del muestreador TPE y semilla efectiva base_seed + k del MLP (como base.yaml)
datos:
  muestra: null  # null = todos los datos (corrida reportada); entero ≥ 3 solo para la demo
logistica:  # = configs/pd/base.yaml (rejilla de 13 C de B-pd §3.1)
  rejilla_C: [1.0e-4, 3.1623e-4, 1.0e-3, 3.1623e-3, 1.0e-2, 3.1623e-2, 1.0e-1, 3.1623e-1, 1.0, 3.1623, 10.0, 31.623, 100.0]
  max_iter: 1000  # iteraciones máximas de lbfgs (como base.yaml)
  tol: 1.0e-6  # tolerancia de lbfgs (como base.yaml)
mlp:  # = bloque mlp de configs/pd/mlp_final.yaml (ensayo 11 de pd-hpo); modo reusar: misma arquitectura
  capas: [32, 16, 32]  # neuronas por capa oculta
  activacion: relu  # φ de las capas ocultas
  dropout: 0.09416553239584849  # probabilidad de apagar una neurona
  l2: 4.451065531349953e-05  # weight_decay = λ de (λ/2)‖W‖²
  optimizador: adam  # optimizador
  lr: 0.004965184800549709  # tasa de aprendizaje
  momento: 0.9  # solo lo usa sgd
  batch: 512  # tamaño de minilote
  max_epocas: 100  # épocas máximas (como mlp_final.yaml)
  paciencia: 10  # parada temprana con la pérdida de val (como mlp_final.yaml)
  device: cpu  # dispositivo (como mlp_final.yaml)
  pos_weight: 1.0  # sin reponderar la clase positiva (obligatorio, B-pd §3.2)
busqueda:
  tipo: sin_busqueda  # modo reusar: la búsqueda del principal se hizo con otros datos (B-pd §3.8)
semillas:
  n: 30  # comparación justa: 30 semillas de la configuración final (núcleo §6)
hpo:  # modo optuna: TPE nuevo con el mismo presupuesto y el mismo espacio que configs/pd/hpo.yaml (B-pd §3.3)
  n_ensayos: 40  # presupuesto de la búsqueda (= hpo.yaml); destino y salida van dentro de {sensibilidad.salida}/optuna/
  espacio:  # = configs/pd/hpo.yaml
    n_capas: [1, 4]  # número de capas ocultas (entero, extremos incluidos)
    neuronas: [16, 32, 64, 128, 256]  # anchura de cada capa
    activacion: [relu, leaky_relu, tanh]  # activaciones
    dropout: [0.0, 0.5]  # uniforme
    l2: [1.0e-6, 1.0e-2]  # log-uniforme
    optimizador: [adam, sgd]  # sgd con mlp.momento
    lr: [1.0e-4, 1.0e-2]  # log-uniforme
    batch: [256, 512, 1024, 2048]  # tamaños de minilote
sensibilidad:
  modos: [reusar, optuna]  # reusar = misma arquitectura que el modelo principal; optuna = arquitectura buscada con 17
  loans_pd: data/processed/loans_pd.parquet  # datos de A (núcleo §5.1)
  features: configs/features.yaml  # las 15 variables del modelo principal
  datos_lc: data/processed/sensibilidad_lc.parquet  # id, grade, int_rate (A, mismas filas y orden)
  adicionales: configs/features_sensibilidad.yaml  # grade e int_rate (bloque `adicionales`)
  config_datos: configs/datos.yaml  # percentiles de recorte del preprocesador (preprocesamiento.percentiles_recorte)
  union: results/data/pd_sensibilidad/loans_pd_sensibilidad.parquet  # loans_pd + grade + int_rate
  preprocesador: models/pd_sensibilidad/preprocesador_pd_sensibilidad.json  # ajustado SOLO con train
  salida: results/data/pd_sensibilidad  # reusar/, optuna/ y comparacion.json
  modelos: models/pd_sensibilidad  # reusar/ y optuna/ con pd_logistica.joblib y pd_mlp.pt
  principal: results/data/pd/summary.json  # modelo principal (solo lectura; pred_test.parquet en la misma carpeta)
