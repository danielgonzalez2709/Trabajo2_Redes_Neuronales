# Notebook 00 (sustentación, núcleo §5.8 y Parte E). Cada demo es un comando de run.py que corre en < 2 min.
# `requiere`: archivos que la demo necesita además de su config (entregas de otras partes).
# `salida_temporal`: la clave de su carpeta de salida; el notebook la apunta a una carpeta temporal para no sobrescribir
# resultados versionados. Cada parte cambia aquí su entrada cuando conecte su demo.
demo: pd         # B6 (propuesta de Andrés; la decide Daniel): demo de PD medida en 13,8–15,1 s; la de A sigue disponible como "eda"
demos:
  eda:
    parte: A
    subcomando: eda
    config: configs/datos.yaml
    salida_temporal: eda.salida
  pd:
    parte: B
    subcomando: pd
    config: configs/pd/demo.yaml
    salida_temporal: salida  # B6: la demo de PD escribe en una carpeta temporal (no pisa results/data/pd_demo)
  lgd:
    parte: D
    subcomando: lgd
    config: configs/lgd/demo.yaml
    salida_temporal: salida
  scorecard:
    parte: C
    subcomando: scorecard
    config: configs/scorecard/base.yaml
    salida_temporal: salida
  el:
    parte: E
    subcomando: el
    config: configs/el/base.yaml
    requiere: [results/data/pd/pred_test.parquet, results/data/lgd/pred_pd_test.parquet]
    salida_temporal: salida
